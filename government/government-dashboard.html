<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVIT - Government Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../style.css" />
    <style>
        .gov-section { padding:30px 0 60px; }
        .gov-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:24px; }
        .gov-header h2 { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:0; }
        .gov-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:30px; }
        .gov-stat-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:18px 20px; text-align:center; transition:0.3s; }
        .gov-stat-card .number { font-size:2rem; font-weight:700; color:#fff; }
        .gov-stat-card .number.blue { color:#3b82f6; }
        .gov-stat-card .number.green { color:#10b981; }
        .gov-stat-card .number.yellow { color:#f59e0b; }
        .gov-stat-card .number.red { color:#ef4444; }
        .gov-grid { display:grid; grid-template-columns:2fr 1fr; gap:24px; }
        .gov-panel { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:24px 20px; }
        .filter-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
        .filter-bar select, .filter-bar input { padding:8px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:#fff; font-size:0.85rem; }
        .complaint-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.04); flex-wrap:wrap; gap:8px; }
        .complaint-item .info { flex:1; }
        .complaint-item .info .title { font-weight:500; color:#fff; }
        .complaint-item .info .meta { font-size:0.8rem; color:rgba(255,255,255,0.4); }
        .complaint-item .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .complaint-item .actions button { padding:4px 12px; border:none; border-radius:20px; font-size:0.7rem; font-weight:600; cursor:pointer; }
        .btn-review { background:rgba(59,130,246,0.15); color:#3b82f6; }
        .btn-progress { background:rgba(139,92,246,0.15); color:#8b5cf6; }
        .btn-resolve { background:rgba(16,185,129,0.15); color:#10b981; }
        .status-badge { font-size:0.65rem; padding:2px 12px; border-radius:20px; font-weight:600; }
        .status-badge.submitted { background:rgba(59,130,246,0.15); color:#3b82f6; }
        .status-badge.progress { background:rgba(139,92,246,0.15); color:#8b5cf6; }
        .status-badge.resolved { background:rgba(16,185,129,0.15); color:#10b981; }
        .status-badge.escalated { background:rgba(239,68,68,0.15); color:#ef4444; }
        
        .cluster-card { background:rgba(139,92,246,0.1); border:1px solid #8b5cf6; padding:15px; border-radius:10px; cursor:pointer; transition:0.3s; }
        .cluster-card:hover { background:rgba(139,92,246,0.2); transform:translateY(-2px); }
        .cluster-card .title { font-weight:bold; color:#8b5cf6; font-size:1.1rem; margin-bottom:5px; }
        .cluster-card .count { color:#fff; font-size:1.5rem; font-weight:bold; }
        @media (max-width:768px) { .gov-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div id="three-canvas"></div>
    <div class="app-overlay">
        <header>
            <div class="container nav-inner">
                <a href="gov-index.html" class="logo"><i class="fas fa-gavel"></i><span>SOLVIT</span></a>
                <div class="nav-links" id="mainNav"></div>
            </div>
        </header>
        <section class="gov-section">
            <div class="container">
                <div class="gov-header">
                    <div>
                        <h2>📊 Government Analytics</h2>
                        <p style="color:rgba(255,255,255,0.5);">Monitor civic complaints, analyze clusters, and generate reports.</p>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button onclick="window.location.href='government-reports.html'" style="padding:8px 20px; border-radius:30px; background:#10b981; color:#fff; border:none; cursor:pointer; font-weight:600;">
                             <i class="fas fa-chart-pie"></i> View Visual Report
                        </button>
                        <button onclick="toggleClusters()" id="clusterBtn" style="padding:8px 20px; border-radius:30px; background:#8b5cf6; color:#fff; border:none; cursor:pointer; font-weight:600;">
                            <i class="fas fa-brain"></i> View AI Clusters
                        </button>
                        <button onclick="window.location.href='gov-index.html'" style="padding:8px 20px; border-radius:30px; background:#3b82f6; color:#fff; border:none; cursor:pointer; font-weight:600;">Home</button>
                    </div>
                </div>

                <!-- Clusters View (Hidden by default) -->
                <div id="clusterView" style="display:none; margin-bottom:30px; background:rgba(255,255,255,0.03); padding:20px; border-radius:20px; border:1px solid rgba(139,92,246,0.3);">
                    <h3 style="margin-bottom:15px; color:#fff;"><i class="fas fa-brain" style="color:#8b5cf6;"></i> AI Description Clusters </h3>
                    <div id="clusterList" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;"></div>
                </div>

                <div class="gov-stats">
                    <div class="gov-stat-card"><div class="number blue" id="totalComplaints">0</div><div class="label">Total Complaints</div></div>
                    <div class="gov-stat-card"><div class="number red" id="unsolvedComplaints">0</div><div class="label">Unsolved / Pending</div></div>
                    <div class="gov-stat-card"><div class="number yellow" id="progressComplaints">0</div><div class="label">In Progress</div></div>
                    <div class="gov-stat-card"><div class="number green" id="resolvedComplaints">0</div><div class="label">Resolved</div></div>
                </div>

                <div class="gov-grid">
                    <div class="gov-panel">
                        <h3><i class="fas fa-list"></i> All Complaints</h3>
                        <div class="filter-bar">
                            <select id="filterStatus" onchange="applyFilters()">
                                <option value="all">All Status</option>
                                <option value="submitted">Submitted (Needs Review)</option>
                                <option value="progress">In Progress</option>
                                <option value="resolved">Resolved</option>
                                <option value="escalated">Escalated to CM</option>
                            </select>
                            <input type="text" id="searchInput" placeholder="🔍 Search..." oninput="applyFilters()" />
                        </div>
                        <div id="complaintsList"></div>
                    </div>
                    <div>
                        <div class="gov-panel">
                            <h3><i class="fas fa-link" style="color:#10b981;"></i> Blockchain Audit</h3>
                            <div style="background:rgba(16,185,129,0.05); border-radius:12px; padding:12px; margin-top:12px; display:flex; align-items:center; gap:10px;">
                                <i class="fas fa-check-circle" style="color:#10b981;"></i>
                                <span>All records immutable & verified</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../script.js"></script>
    <script>
        const API_BASE = window.SOLVIT_API_BASE;
        let allComplaints = [];
        let filteredComplaints = [];

        document.addEventListener('DOMContentLoaded', () => loadDashboard());

        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/complaints`);
                allComplaints = await res.json();
                applyFilters();
            } catch (err) { console.error(err); }
        }

        function applyFilters() {
            const statusFilter = document.getElementById('filterStatus').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredComplaints = allComplaints.filter(c => {
                const cStatus = c.isEscalated ? 'escalated' : (c.status || 'submitted').toLowerCase();
                const matchStatus = statusFilter === 'all' || cStatus === statusFilter;
                const matchSearch = c.title.toLowerCase().includes(searchTerm) || c.id.toLowerCase().includes(searchTerm);
                return matchStatus && matchSearch;
            });

            updateStats();
            renderTable();
        }

        function updateStats() {
            document.getElementById('totalComplaints').textContent = filteredComplaints.length;
            document.getElementById('unsolvedComplaints').textContent = filteredComplaints.filter(c => !c.isReviewed && !c.isEscalated).length;
            document.getElementById('progressComplaints').textContent = filteredComplaints.filter(c => c.status === 'In Progress').length;
            document.getElementById('resolvedComplaints').textContent = filteredComplaints.filter(c => c.status === 'Resolved').length;
        }

        function renderTable() {
            const container = document.getElementById('complaintsList');
            if (filteredComplaints.length === 0) { container.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">No complaints found.</p>'; return; }

            let html = '';
            filteredComplaints.forEach(c => {
                const isEscalated = c.isEscalated;
                const statusClass = isEscalated ? 'escalated' : (c.status || 'submitted').toLowerCase().replace(' ', '');
                const statusText = isEscalated ? '🚨 Escalated to CM' : c.status;

                // Action Buttons
                let actions = '';
                if (!c.isReviewed && !c.isEscalated) {
                    actions = `<button class="btn-review" onclick="reviewComplaint('${c.id}')"><i class="fas fa-eye"></i> Mark Reviewed</button>`;
                } else if (c.status === 'Under Review') {
                    actions = `<button class="btn-progress" onclick="updateStatus('${c.id}', 'In Progress')"><i class="fas fa-play"></i> Progress</button>`;
                } else if (c.status === 'In Progress') {
                    actions = `<button class="btn-resolve" onclick="updateStatus('${c.id}', 'Resolved')"><i class="fas fa-check"></i> Resolve</button>`;
                }

                html += `
                    <div class="complaint-item">
                        <div class="info">
                            <div class="title">${c.title}</div>
                            <div class="meta">
                                <span class="status-badge ${statusClass}">${statusText}</span> · ${c.category} · ${c.district}
                            </div>
                        </div>
                        <div class="actions">${actions}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.reviewComplaint = async function(id) {
            if (!confirm('Mark this complaint as reviewed? This stops the 24-hour SLA timer.')) return;
            await fetch(`${API_BASE}/complaints/${id}/review`, { method: 'PUT' });
            loadDashboard();
        };

        window.updateStatus = async function(id, newStatus) {
            const res = await fetch(`${API_BASE}/complaints`);
            const complaints = await res.json();
            const item = complaints.find(c => c.id === id);
            if (!item) return;
            
            item.status = newStatus;
            item.timeline.push({ status: newStatus, date: new Date(), remark: `Status updated to ${newStatus}` });

            await fetch(`${API_BASE}/complaints/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            });
            loadDashboard();
        };

        // ─── AI CLUSTERING ───
        window.toggleClusters = async function() {
            const view = document.getElementById('clusterView');
            if (view.style.display === 'block') { view.style.display = 'none'; return; }
            
            const list = document.getElementById('clusterList');
            list.innerHTML = '<p style="color:#fff;">Analyzing text data...</p>';
            
            try {
                const res = await fetch(`${API_BASE}/complaints/clusters`);
                const clusters = await res.json();
                let html = '';
                clusters.forEach(c => {
                    html += `
                        <div class="cluster-card">
                            <div class="title">${c.clusterName}</div>
                            <div class="count">${c.count} <span style="font-size:0.8rem; font-weight:normal; color:rgba(255,255,255,0.6);">Complaints</span></div>
                        </div>
                    `;
                });
                list.innerHTML = html;
                view.style.display = 'block';
            } catch (err) { list.innerHTML = '<p style="color:#ef4444;">Failed to load.</p>'; }
        };

        // ─── DOWNLOAD REPORT ───
        window.downloadReport = function() {
            window.open(`${API_BASE}/complaints/report/monthly`, '_blank');
        };
    </script>
</body>
</html>
