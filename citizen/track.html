<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVIT - Track Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../style.css" />
    <style>
        .track-section { padding: 40px 0 60px; }
        .track-card { max-width: 820px; margin: 0 auto; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 40px 36px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3b82f6; text-decoration: none; font-weight: 600; }
        .app-id { font-size: 0.85rem; color: rgba(255,255,255,0.3); margin-bottom: 8px; }
        .app-id span { color: #f59e0b; font-weight: 600; }
        .track-card h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #fff; margin-bottom: 20px; }
        
        /* ─── PROGRESS FLOW DIAGRAM CSS ─── */
        .progress-container { margin: 30px 0 24px; padding: 0 10px; }
        .steps-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; padding: 0 10px; }
        .steps-row::before { content: ''; position: absolute; top: 18px; left: 25px; right: 25px; height: 3px; background: rgba(255,255,255,0.08); z-index: 0; }
        .steps-row .step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
        .steps-row .step .circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 3px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.2); transition: 0.4s; position: relative; }
        .steps-row .step .circle.active { background: #3b82f6; border-color: #3b82f6; color: #fff; box-shadow: 0 0 30px rgba(59,130,246,0.3); }
        .steps-row .step .circle.completed { background: #10b981; border-color: #10b981; color: #fff; box-shadow: 0 0 20px rgba(16,185,129,0.2); }
        .steps-row .step .label { font-size: 0.75rem; font-weight: 500; color: rgba(255,255,255,0.3); margin-top: 8px; text-align: center; transition: 0.3s; }
        .steps-row .step .label.active { color: #fff; font-weight: 600; }
        .steps-row .step .label.completed { color: #10b981; }

        /* ─── STATUS MESSAGE CSS ─── */
        .status-message { background: rgba(59,130,246,0.05); border: 1px solid rgba(59,130,246,0.1); border-radius: 12px; padding: 16px 20px; margin: 16px 0 28px; display: flex; gap: 12px; }
        .status-message.escalated { background: rgba(239,68,68,0.1); border-color: #ef4444; }
        
        /* ─── DETAILS & TIMELINE CSS ─── */
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; background: rgba(255,255,255,0.02); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; }
        .details-grid .label { color: rgba(255,255,255,0.3); font-size: 0.7rem; text-transform: uppercase; }
        .details-grid .value { font-weight: 500; color: #fff; font-size: 0.95rem; }
        .timeline-section { margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 20px; }
        .timeline-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .timeline-item .dot { width: 10px; height: 10px; border-radius: 50%; background: #3b82f6; margin-top: 5px; flex-shrink: 0; }
        .timeline-item .dot.completed { background: #10b981; }
        .timeline-item .dot.escalated { background: #ef4444; }
        .btn-back { display: inline-block; margin-top: 20px; padding: 10px 28px; background: rgba(255,255,255,0.06); border-radius: 30px; color: #fff; text-decoration: none; }
        
        /* ─── SLA & ESCALATION UI CSS ─── */
        .sla-banner { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .sla-banner .text strong { color: #ef4444; font-size: 1.1rem; display: block; margin-bottom: 4px; }
        .sla-banner .text p { color: rgba(255,255,255,0.7); font-size: 0.9rem; }
        .btn-escalate { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-escalate:hover { background: #dc2626; transform: scale(1.05); }
        .escalated-banner { background: rgba(245,158,11,0.1); border: 1px solid #f59e0b; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .escalated-banner strong { color: #f59e0b; font-size: 1.1rem; display: block; margin-bottom: 4px; }

        @media (max-width: 600px) {
            .track-card { padding: 24px 18px; }
            .details-grid { grid-template-columns: 1fr; gap: 8px; }
            .steps-row .step .circle { width: 28px; height: 28px; font-size: 0.65rem; }
            .steps-row .step .label { font-size: 0.6rem; margin-top: 4px; }
            .steps-row::before { top: 14px; left: 18px; right: 18px; }
        }
    </style>
</head>
<body>
    <div id="three-canvas"></div>
    <div class="app-overlay">
        <header>
            <div class="container nav-inner">
                <a href="index.html" class="logo"><i class="fas fa-gavel"></i><span>SOLVIT</span></a>
                <div class="nav-links" id="mainNav"></div>
            </div>
        </header>
        <section class="track-section">
            <div class="container">
                <div class="track-card" id="trackCard">
                    <div id="trackContent"><p style="text-align:center; color:#888;">Loading...</p></div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../script.js"></script>
    <script>
        const API_BASE = 'https://solvit-platform.onrender.com/api';

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');
            const container = document.getElementById('trackContent');

            if (!appId) { container.innerHTML = `<h2 style="color:red;">Error: No ID</h2>`; return; }

            fetch(`${API_BASE}/complaints`)
            .then(res => res.json())
            .then(items => {
                const item = items.find(i => i.id === appId);
                if (!item) { container.innerHTML = `<h2 style="color:red;">Complaint Not Found</h2>`; return; }
                renderTracking(item);
            });
        });

        // ─── STATUS MAPPING FUNCTION ───
        function getStepFromStatus(status) {
            if (!status) return 0;
            const s = status.toLowerCase().trim();
            const exactMap = {
                'submitted': 0, 'reported': 0, 'active': 0, 'pending': 0, 'new': 0,
                'under review': 1, 'assigned': 1, 'under investigation': 1, 'review': 1, 'investigation': 1,
                'in progress': 2, 'progress': 2, 'processing': 2, 'in-progress': 2, 'inprogress': 2, 'funds released': 2,
                'resolved': 3, 'completed': 3, 'closed': 3, 'approved': 3, 'disbursed': 3, 'done': 3
            };
            if (exactMap[s] !== undefined) return exactMap[s];
            if (s.includes('resolve') || s.includes('complete') || s.includes('close') || s.includes('approve') || s.includes('disburse')) return 3;
            if (s.includes('progress') || s.includes('processing')) return 2;
            if (s.includes('review') || s.includes('assign') || s.includes('investigation')) return 1;
            return 0;
        }

        function renderTracking(item) {
            const status = item.status || 'Submitted';
            const currentStep = getStepFromStatus(status);

            // 1. Calculate SLA Status
            const now = new Date();
            const deadline = new Date(item.slaDeadline);
            const isOverdue = now > deadline && !item.isReviewed && !item.isEscalated;
            
            // 2. Build SLA / Escalation Banner
            let slaHtml = '';
            if (item.isEscalated) {
                slaHtml = `
                    <div class="escalated-banner">
                        <strong><i class="fas fa-building"></i> Escalated to CM Cell</strong>
                        <p style="color:rgba(255,255,255,0.7); font-size:0.9rem;">The Chief Minister's special cell is now monitoring this complaint.</p>
                    </div>
                `;
            } else if (isOverdue) {
                slaHtml = `
                    <div class="sla-banner">
                        <div class="text">
                            <strong><i class="fas fa-exclamation-triangle"></i> 24-Hour SLA Breached!</strong>
                            <p>The department failed to review this within 24 hours.</p>
                        </div>
                        <button class="btn-escalate" onclick="escalateToCM('${item.id}')">
                            Escalate to CM Cell
                        </button>
                    </div>
                `;
            } else if (!item.isReviewed) {
                const hoursLeft = Math.max(0, Math.floor((deadline - now) / (1000 * 60 * 60)));
                slaHtml = `
                    <div style="background:rgba(59,130,246,0.1); border:1px solid #3b82f6; border-radius:12px; padding:12px; margin-bottom:20px; font-size:0.9rem;">
                        <i class="fas fa-clock" style="color:#3b82f6;"></i> Government has <strong>${hoursLeft} hours</strong> left to review this complaint.
                    </div>
                `;
            }

            // 3. Build the Progress Flow Diagram (Steps)
            const steps = ['Submitted', 'Under Review', 'In Progress', 'Resolved'];
            let stepsHtml = `<div class="progress-container"><div class="steps-row">`;
            
            steps.forEach((step, idx) => {
                let stepClass = '';
                let icon = (idx + 1);
                
                if (idx < currentStep) {
                    stepClass = 'completed';
                    icon = '<i class="fas fa-check"></i>';
                } else if (idx === currentStep) {
                    const isResolved = currentStep === 3 &&
                        (status.toLowerCase().includes('resolve') ||
                         status.toLowerCase().includes('complete') ||
                         status.toLowerCase().includes('closed') ||
                         status.toLowerCase().includes('approve') ||
                         status.toLowerCase().includes('disburse'));
                    if (isResolved) {
                        stepClass = 'completed';
                        icon = '<i class="fas fa-check"></i>';
                    } else {
                        stepClass = 'active';
                    }
                }
                stepsHtml += `<div class="step"><div class="circle ${stepClass}">${icon}</div><div class="label ${stepClass}">${step}</div></div>`;
            });
            stepsHtml += `</div></div>`;

            // 4. Build Timeline
            let timelineHtml = '';
            const sortedTimeline = [...(item.timeline || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
            sortedTimeline.forEach(t => {
                const dotClass = t.status.includes('Resolved') ? 'completed' : t.status.includes('Escalated') ? 'escalated' : '';
                timelineHtml += `
                    <div class="timeline-item">
                        <div class="dot ${dotClass}"></div>
                        <div>
                            <div style="font-weight:500; color:#fff;">${t.status}</div>
                            <div style="font-size:0.75rem; color:#888;">${new Date(t.date).toLocaleString()}</div>
                            ${t.remark ? `<div style="font-size:0.85rem; color:#aaa;">${t.remark}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            // 5. Final HTML Compilation
            const html = `
                <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                <div class="app-id">Application ID: <span>${item.id}</span></div>
                <h2>${item.title}</h2>
                
                ${slaHtml}
                ${stepsHtml}

                <div class="status-message ${item.isEscalated ? 'escalated' : ''}">
                    <div>
                        <div style="font-weight:600; color:#fff;">Current Status: ${item.isEscalated ? 'Escalated to CM Cell' : status}</div>
                        <div style="color:#888; font-size:0.9rem;">Last updated: ${new Date(item.createdAt).toLocaleDateString()}</div>
                    </div>
                </div>

                <div class="details-grid">
                    <div><div class="label">Category</div><div class="value">${item.category}</div></div>
                    <div><div class="label">District</div><div class="value">${item.district}</div></div>
                    <div><div class="label">Location</div><div class="value">${item.location}</div></div>
                    <div><div class="label">Blockchain Hash</div><div class="value" style="font-size:0.7rem; word-break:break-all;">${item.blockchain?.hash || 'N/A'}</div></div>
                </div>

                <div class="timeline-section">
                    <h4><i class="fas fa-clock"></i> Activity Timeline</h4>
                    ${timelineHtml}
                </div>

                <a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
            `;

            document.getElementById('trackContent').innerHTML = html;
        }

        // CM ESCALATION FUNCTION
        window.escalateToCM = async function(id) {
            if (!confirm('Are you sure you want to escalate this directly to the CM Cell? This is a final resort.')) return;
            
            const res = await fetch(`${API_BASE}/complaints/${id}/escalate`, { method: 'PUT' });
            if (res.ok) {
                alert('🚨 Escalated successfully. The CM Cell has been notified.');
                window.location.reload();
            } else {
                alert('Failed to escalate.');
            }
        };
    </script>
</body>
</html>
