<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVIT - Track Application</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../style.css" />

    <style>
        .track-section {
            padding: 40px 0 60px;
        }

        .track-card {
            max-width: 820px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .track-card .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .track-card .back-link:hover {
            color: #8b5cf6;
        }

        .track-card .app-id {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 8px;
        }

        .track-card .app-id span {
            color: #f59e0b;
            font-weight: 600;
        }

        .track-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 2px;
            color: #fff;
        }

        .track-card .app-category {
            display: inline-block;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3b82f6;
            margin-bottom: 24px;
        }

        /* ─── PROGRESS STEPS ─── */
        .progress-container {
            margin: 30px 0 24px;
            padding: 0 10px;
        }

        .steps-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            padding: 0 10px;
        }

        .steps-row::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 25px;
            right: 25px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 0;
        }

        .steps-row .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            flex: 1;
        }

        .steps-row .step .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            transition: 0.4s;
            position: relative;
        }

        .steps-row .step .circle.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .steps-row .step .circle.completed {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .steps-row .step .circle.completed i {
            font-size: 0.8rem;
        }

        .steps-row .step .label {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 8px;
            text-align: center;
            letter-spacing: 0.3px;
            transition: 0.3s;
        }

        .steps-row .step .label.active {
            color: #fff;
            font-weight: 600;
        }

        .steps-row .step .label.completed {
            color: #10b981;
        }

        /* ─── STATUS MESSAGE ─── */
        .status-message {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 16px 0 28px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .status-message .icon {
            font-size: 1.2rem;
            color: #3b82f6;
            margin-top: 2px;
        }

        .status-message .icon.completed {
            color: #10b981;
        }

        .status-message .icon.pending {
            color: #f59e0b;
        }

        .status-message .content .status-label {
            font-weight: 600;
            color: #fff;
            font-size: 1rem;
        }

        .status-message .content .status-desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        /* ─── DETAILS GRID ─── */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .details-grid .item .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .details-grid .item .value {
            font-weight: 500;
            color: #fff;
            font-size: 0.95rem;
        }

        /* ─── TIMELINE ─── */
        .timeline-section {
            margin-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }

        .timeline-section h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }

        .timeline-section h4 i {
            color: #3b82f6;
            margin-right: 8px;
        }

        .timeline-item {
            display: flex;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            align-items: flex-start;
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .timeline-item .dot.completed {
            background: #10b981;
        }

        .timeline-item .dot.pending {
            background: #f59e0b;
        }

        .timeline-item .tl-content .tl-status {
            font-weight: 500;
            color: #fff;
        }

        .timeline-item .tl-content .tl-date {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .timeline-item .tl-content .tl-remark {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 28px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            .track-card {
                padding: 24px 18px;
            }

            .details-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .steps-row {
                padding: 0;
                flex-wrap: nowrap;
            }

            .steps-row .step .circle {
                width: 28px;
                height: 28px;
                font-size: 0.65rem;
            }

            .steps-row .step .label {
                font-size: 0.6rem;
                margin-top: 4px;
            }

            .steps-row::before {
                top: 14px;
                left: 18px;
                right: 18px;
            }

            .status-message {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div id="three-canvas"></div>

    <div class="app-overlay">
        <header>
            <div class="container nav-inner">
                <a href="index.html" class="logo">
                    <i class="fas fa-gavel"></i>
                    <span>SOLVIT</span>
                </a>
                <div class="nav-links" id="mainNav"></div>
            </div>
        </header>

        <section class="track-section">
            <div class="container">
                <div class="track-card" id="trackCard">
                    <div id="trackContent">
                        <p style="color:rgba(255,255,255,0.4); text-align:center; padding:40px 0;">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer" style="margin-top: 0;">
            <div class="container">
                <div class="footer-grid">
                    <div class="footer-brand">
                        <div class="logo"><i class="fas fa-gavel"></i><span>SOLVIT</span></div>
                        <p>Smart Governance. One Platform. For 1.4 Billion.</p>
                        <div class="social-links">
                            <a href="#"><i class="fab fa-twitter"></i></a>
                            <a href="#"><i class="fab fa-linkedin-in"></i></a>
                            <a href="#"><i class="fab fa-github"></i></a>
                            <a href="#"><i class="fab fa-youtube"></i></a>
                        </div>
                    </div>
                    <div class="footer-links">
                        <h4>Services</h4>
                        <a href="services.html">Complaint Management</a>
                        <a href="services.html">Petition Portal</a>
                        <a href="services.html">Land & Revenue</a>
                    </div>
                    <div class="footer-links">
                        <h4>Company</h4>
                        <a href="#">About Us</a>
                        <a href="#">Careers</a>
                    </div>
                    <div class="footer-links">
                        <h4>Legal</h4>
                        <a href="#">Privacy Policy</a>
                        <a href="#">Terms</a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; 2026 SOLVIT. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ─── GET APPLICATION ID FROM URL ───
            const urlParams = new URLSearchParams(window.location.search);
            const appId = urlParams.get('id');
            const service = urlParams.get('service') || 'complaint';

            const container = document.getElementById('trackContent');

            if (!appId) {
                container.innerHTML = `
                    <h2 style="color:#ef4444;">❌ Error</h2>
                    <p style="color:rgba(255,255,255,0.5);">No application ID provided.</p>
                    <a href="dashboard.html" class="btn-back">⬅ Back to Dashboard</a>
                `;
                return;
            }

            // ─── SERVICE KEY MAPPING ───
            const serviceKeys = {
                complaint: 'solvit_complaints',
                petition: 'solvit_petitions',
                land: 'solvit_land_applications',
                rti: 'solvit_rti_requests',
                health: 'solvit_health_reports',
                education: 'solvit_edu_reports',
                safety: 'solvit_safety_complaints',
                agriculture: 'solvit_agri_applications',
                loan: 'solvit_loan_applications',
                corruption: 'solvit_corruption_reports',
                infrastructure: 'solvit_infra_reports'
            };

            const key = serviceKeys[service];
            if (!key) {
                container.innerHTML = `
                    <h2 style="color:#ef4444;">❌ Error</h2>
                    <p style="color:rgba(255,255,255,0.5);">Invalid service type.</p>
                    <a href="dashboard.html" class="btn-back">⬅ Back to Dashboard</a>
                `;
                return;
            }

            // ─── FETCH DATA ───
            const allItems = JSON.parse(localStorage.getItem(key)) || [];
            const item = allItems.find(i => i.id === appId);

            if (!item) {
                container.innerHTML = `
                    <h2 style="color:#ef4444;">❌ Not Found</h2>
                    <p style="color:rgba(255,255,255,0.5);">Application not found.</p>
                    <a href="dashboard.html" class="btn-back">⬅ Back to Dashboard</a>
                `;
                return;
            }

            // ─── STATUS TO STEP MAPPING ───
            function getStepFromStatus(status) {
                if (!status) return 0;
                const s = status.toLowerCase().trim();

                const exactMap = {
                    'submitted': 0,
                    'reported': 0,
                    'active': 0,
                    'pending': 0,
                    'new': 0,
                    'under review': 1,
                    'assigned': 1,
                    'under investigation': 1,
                    'review': 1,
                    'investigation': 1,
                    'in progress': 2,
                    'progress': 2,
                    'processing': 2,
                    'in-progress': 2,
                    'inprogress': 2,
                    'funds released': 2,
                    'resolved': 3,
                    'completed': 3,
                    'closed': 3,
                    'approved': 3,
                    'disbursed': 3,
                    'done': 3
                };

                if (exactMap[s] !== undefined) return exactMap[s];

                if (s.includes('resolve') || s.includes('complete') || s.includes('close') ||
                    s.includes('approve') || s.includes('disburse')) return 3;
                if (s.includes('progress') || s.includes('processing')) return 2;
                if (s.includes('review') || s.includes('assign') || s.includes('investigation')) return 1;

                return 0;
            }

            const status = item.status || 'Submitted';
            let currentStep = getStepFromStatus(status);

            // ─── STEPS ───
            const steps = [
                { label: 'Submitted', icon: 'fa-file-alt' },
                { label: 'Under Review', icon: 'fa-search' },
                { label: 'In Progress', icon: 'fa-spinner' },
                { label: 'Resolved', icon: 'fa-check-circle' }
            ];

            // ─── STATUS MESSAGES ───
            const statusMessages = [
                { label: 'Submitted', desc: 'Your application has been received and is waiting for department review.' },
                { label: 'Under Review', desc: 'Your application is being reviewed by the concerned department.' },
                { label: 'In Progress', desc: 'Your application is being processed and action is being taken.' },
                { label: 'Resolved', desc: 'Your application has been resolved successfully. Thank you for your patience.' }
            ];

            // ─── TIMELINE ───
            const timeline = item.timeline || [
                { status: status || 'Submitted', date: item.createdAt || new Date().toISOString(), remark: 'Application submitted.' }
            ];

            // ─── BUILD HTML ───
            let html = '';

            html += `<a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>`;
            html += `<div class="app-id">Application ID: <span>${item.id}</span></div>`;
            html += `<h2>${item.title || 'Application'}</h2>`;
            html += `<div class="app-category"><i class="fas fa-tag"></i> ${item.category || service.charAt(0).toUpperCase() + service.slice(1)}</div>`;

            // ─── PROGRESS STEPS ───
            html += `<div class="progress-container">`;
            html += `<div class="steps-row">`;

            steps.forEach((step, idx) => {
                let stepClass = '';
                let icon = (idx + 1);

                if (idx < currentStep) {
                    stepClass = 'completed';
                    icon = '<i class="fas fa-check"></i>';
                } else if (idx === currentStep) {
                    // Special case: if the current step is the final one and status is resolved, show completed (green)
                    if (currentStep === 3 && (status.toLowerCase().includes('resolve') || status.toLowerCase().includes('complete') || status.toLowerCase().includes('closed') || status.toLowerCase().includes('approve') || status.toLowerCase().includes('disburse'))) {
                        stepClass = 'completed';
                        icon = '<i class="fas fa-check"></i>';
                    } else {
                        stepClass = 'active';
                        icon = (idx + 1);
                    }
                }

                html += `
                    <div class="step">
                        <div class="circle ${stepClass}">${icon}</div>
                        <div class="label ${stepClass}">${step.label}</div>
                    </div>
                `;
            });

            html += `</div>`;
            html += `</div>`;

            // ─── STATUS MESSAGE ───
            const msg = statusMessages[currentStep] || statusMessages[0];
            const msgIcon = currentStep === 3 ? 'fa-check-circle completed' :
                            currentStep > 0 ? 'fa-clock pending' : 'fa-file-alt';

            html += `
                <div class="status-message">
                    <div class="icon ${currentStep === 3 ? 'completed' : currentStep > 0 ? 'pending' : ''}">
                        <i class="fas ${msgIcon}"></i>
                    </div>
                    <div class="content">
                        <div class="status-label">${msg.label}</div>
                        <div class="status-desc">${msg.desc}</div>
                    </div>
                </div>
            `;

            // ─── DETAILS GRID ───
            html += `<div class="details-grid">`;
            html += `
                <div class="item"><div class="label">Service</div><div class="value">${service.charAt(0).toUpperCase() + service.slice(1)}</div></div>
                <div class="item"><div class="label">Category</div><div class="value">${item.category || 'N/A'}</div></div>
                <div class="item"><div class="label">Submitted On</div><div class="value">${new Date(item.createdAt || Date.now()).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })}</div></div>
                <div class="item"><div class="label">Current Status</div><div class="value" style="color:#3b82f6;">${item.status || 'Submitted'}</div></div>
                ${item.location ? `<div class="item"><div class="label">Location</div><div class="value">${item.location}</div></div>` : ''}
                ${item.district ? `<div class="item"><div class="label">District</div><div class="value">${item.district}</div></div>` : ''}
                ${item.assignedOfficer ? `<div class="item"><div class="label">Assigned Officer</div><div class="value">${item.assignedOfficer}</div></div>` : ''}
            `;
            html += `</div>`;

            // ─── TIMELINE ───
            html += `
                <div class="timeline-section">
                    <h4><i class="fas fa-clock"></i> Activity Timeline</h4>
            `;

            const sortedTimeline = [...timeline].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedTimeline.forEach(t => {
                const dotClass = t.status === 'Resolved' || t.status === 'Closed' || t.status === 'Completed' ? 'completed' :
                                 t.status === 'In Progress' ? 'pending' : '';
                html += `
                    <div class="timeline-item">
                        <div class="dot ${dotClass}"></div>
                        <div class="tl-content">
                            <div class="tl-status">${t.status}</div>
                            <div class="tl-date">${new Date(t.date).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</div>
                            ${t.remark ? `<div class="tl-remark">${t.remark}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;

            html += `<a href="dashboard.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>`;

            container.innerHTML = html;
        });
    </script>

</body>
</html>
